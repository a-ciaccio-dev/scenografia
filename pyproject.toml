[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenografia"
version = "0.1.0"
description = "AI-powered theatrical scenic design generation CLI and Web Studio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Scenografia Contributors"}
]

dependencies = [
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
web = [
    "streamlit>=1.35",
]

[project.scripts]
scenografia = "scenografia.main:app"

[project.urls]
Repository = "https://github.com/a-ciaccio-dev/scenografia.git"
Documentation = "https://github.com/a-ciaccio-dev/scenografia#readme"

[tool.setuptools]
packages = ["scenografia", "scenografia.agents", "scenografia.providers", "scenografia.schemas", "scenografia.services", "scenografia.styles", "scenografia.tools", "scenografia.web"]

[tool.setuptools.package-data]
scenografia = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/scenografia --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
